<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Captcha</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="captcha-container">
        <div class="captcha-box">
            <h2><i class="fas fa-shield-alt"></i> Verificação de Segurança</h2>
            <div class="captcha-image" id="captchaImage"></div>
            <div class="captcha-controls">
                <input type="text" id="captchaInput" placeholder="Digite o código acima" autocomplete="off" spellcheck="false">
                <button id="verifyButton">
                    <i class="fas fa-check"></i>
                    Verificar
                </button>
            </div>
            <div id="resultMessage"></div>
            <div class="captcha-info">
                <i class="fas fa-info-circle"></i>
                <span>Digite o código exatamente como mostrado</span>
            </div>
            <div class="captcha-timer">
                <i class="fas fa-clock"></i>
                <span id="timer">2:00</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
